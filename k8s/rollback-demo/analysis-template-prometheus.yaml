apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: 20s
      initialDelay: 45s
      count: 3
      failureLimit: 0
      successCondition: result[0] < 0.05
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:80
          query: |
            (sum(rate(flask_http_request_total{status=~"5..",rollouts_pod_template_hash="{{args.canary-hash}}"}[1m])) or vector(0))
            /
            sum(rate(flask_http_request_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))