apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null http://sample-app-canary:5000/health
                curl -s -o /dev/null http://sample-app-stable:5000/health
                sleep 1
              done